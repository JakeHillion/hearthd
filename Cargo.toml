[workspace]
members = [
  "crates/hearthd",
  "crates/hearthd_config",
  "crates/hearthd_config_derive",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"

[workspace.metadata.crane]
name = "hearthd-workspace"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
ariadne = "0.6"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
insta = "1.40"
linkme = "0.3.35"
rand = "0.9"
# TLS everywhere is rustls with the `ring` provider, never aws-lc-rs: aws-lc-sys
# needs cmake and bindgen at build time, which the flake's empty
# nativeBuildInputs does not supply. The `*-no-provider` features below exist to
# keep that default out.
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "http2", "json", "query", "rustls-no-provider"] }
rumqttc = { version = "0.25", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3.14"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
chumsky = "0.13"
facet = "0.46"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
