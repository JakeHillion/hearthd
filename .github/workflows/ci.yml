name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  nix:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Install Nix
      uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.hearthd.dev
          extra-trusted-public-keys = nixcache.hearthd.dev-1:nDKId0zqk7popcBT1tHB9j3nAGU3meWFuJjWzVKab/o=

    - name: Setup Nix S3 cache
      uses: testquorum/nix-s3-generations@45aa2ff2b0df67b5f48a1b710c574c754f08a0c7 # v0.1.4
      with:
        s3-endpoint: https://28e45df51086264c6d9cf2b5e6ecc190.r2.cloudflarestorage.com
        bucket: hearthd-nix
        public-key: nixcache.hearthd.dev-1:nDKId0zqk7popcBT1tHB9j3nAGU3meWFuJjWzVKab/o=
        private-key: ${{ secrets.NIX_SIGNING_KEY }}
        region: auto
        aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    - name: Build all outputs
      run: |
        # Get current system using Nix
        SYSTEM=$(nix-instantiate --eval -E builtins.currentSystem | tr -d '"')

        echo "Building for system: $SYSTEM"

        echo "Discovering all buildable outputs..."
        buildable_outputs=$(nix flake show --json | jq -r --arg system "$SYSTEM" '
          [
            (.packages[$system] // {} | to_entries[] | ".#packages." + $system + "." + .key),
            (.checks[$system] // {} | to_entries[] | ".#checks." + $system + "." + .key),
            (.devShells[$system] // {} | to_entries[] | ".#devShells." + $system + "." + .key)
          ] | .[]
        ')

        echo "Found buildable outputs:"
        echo "$buildable_outputs"

        echo "Building all outputs..."
        echo "$buildable_outputs" | xargs nix build

    - name: Flake check
      run: nix flake check
