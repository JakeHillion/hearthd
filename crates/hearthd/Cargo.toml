[package]
name = "hearthd"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["integration_mqtt", "integration_ecoflow", "integration_metno", "integration_snapcast", "integration_wake_on_lan", "integration_anker_solix"]
integration_anker_solix = ["dep:bluer", "dep:nix", "dep:futures", "dep:uuid", "dep:aes-gcm", "dep:p256"]
integration_mqtt = ["dep:rumqttc"]
integration_ecoflow = [
  "dep:base64",
  "dep:rand",
  "dep:reqwest",
  "dep:rumqttc",
  "dep:rustls",
  "dep:webpki-roots",
  "rumqttc/use-rustls-no-provider",
]
integration_metno = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]
integration_snapcast = []
integration_wake_on_lan = ["dep:surge-ping"]

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
hearthd_config = { path = "../hearthd_config" }
hostname = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ariadne = { workspace = true }
chumsky = { workspace = true }
facet = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
twox-hash = { workspace = true }

# Integration dependencies (optional, enabled by feature)
rumqttc = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
surge-ping = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
aes-gcm = { version = "0.10", optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }
nix = { version = "0.29", default-features = false, features = ["fs"], optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
