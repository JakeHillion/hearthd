[package]
name = "hearthd"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["integration_mqtt", "integration_ecoflow", "integration_metno", "integration_dyson"]
integration_mqtt = ["dep:rumqttc"]
integration_ecoflow = [
  "dep:base64",
  "dep:rand",
  "dep:reqwest",
  "dep:rumqttc",
  "dep:rustls",
  "dep:webpki-roots",
  "rumqttc/use-rustls-no-provider",
]
integration_metno = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]
integration_dyson = ["dep:reqwest", "dep:rumqttc", "dep:rustls", "dep:webpki-roots", "dep:base64", "dep:aes", "dep:cbc", "dep:rpassword", "rumqttc/use-rustls-no-provider"]

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
hearthd_config = { path = "../hearthd_config" }
hostname = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ariadne = { workspace = true }
chumsky = { workspace = true }
facet = { workspace = true }
strum = { workspace = true }

# Integration dependencies (optional, enabled by feature)
rumqttc = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
