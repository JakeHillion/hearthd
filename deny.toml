[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "ISC",
]

[[licenses.exceptions]]
crate = "bluer"
allow = ["BSD-2-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
